name: Backend checks
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q backend
      - run: python -m pytest -q tests
        env:
          DAY1_SALT: demo-salt
