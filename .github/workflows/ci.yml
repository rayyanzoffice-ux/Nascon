name: Backend checks
on:
  push:
    branches: [main, 'work/devops-release']
  pull_request:
  workflow_dispatch:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q backend
      - run: ./run_tests.sh
        env:
          DAY1_SALT: demo-salt

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DAY1_SALT: demo-salt
      NASCON_BASE_URL: http://127.0.0.1:8080
      QA_TEST_SALT: demo-salt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Start clean Compose stack
        run: docker compose up -d --build
      - name: Verify health
        run: |
          for attempt in $(seq 1 60); do
            if [ "$(curl --silent --show-error --max-time 3 http://127.0.0.1:8080/health 2>/dev/null)" = '{"status":"ok"}' ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1
      - name: Exercise live API contracts
        run: python -m pytest -q tests/test_live_contract.py
      - name: Create persisted order
        run: |
          python - <<'PY'
          import httpx
          base = "http://127.0.0.1:8080"
          with httpx.Client(base_url=base, timeout=10) as client:
              response = client.post("/audit/v1/reset", json={"seed": 42, "stock": {"var-jersey-001-M": 1}})
              assert response.status_code == 200, response.text
              response = client.post("/audit/v1/checkout", json={
                  "order_id": "ci-persist-order",
                  "customer_id": "ci-buyer",
                  "items": [{"variant_id": "var-jersey-001-M", "quantity": 1}],
                  "discount_code": None,
                  "payment": {"token": "tok_success"},
              })
              assert response.status_code == 201, response.text
              inventory = client.get("/audit/v1/inventory/var-jersey-001-M")
              assert inventory.status_code == 200, inventory.text
              assert inventory.json() == {"variant_id": "var-jersey-001-M", "stock": 0, "reserved": 0}
          PY
      - name: Restart database and Redis
        run: docker compose restart db redis
      - name: Verify state survives restart
        run: |
          python - <<'PY'
          import time
          import httpx
          url = "http://127.0.0.1:8080/audit/v1/inventory/var-jersey-001-M"
          for attempt in range(30):
              try:
                  response = httpx.get(url, timeout=3)
                  if response.status_code == 200:
                      assert response.json() == {"variant_id": "var-jersey-001-M", "stock": 0, "reserved": 0}
                      break
              except httpx.RequestError:
                  pass
              time.sleep(2)
          else:
              raise AssertionError("Persisted stock unavailable after restart")
          PY
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Stop stack
        if: always()
        run: docker compose down
