name: Build NaSCon Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/lib/**'
      - 'mobile/android/**'
      - 'mobile/pubspec.yaml'
      - 'mobile/pubspec.lock'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'mobile/lib/**'
      - 'mobile/android/**'
      - 'mobile/pubspec.yaml'
      - 'mobile/pubspec.lock'
      - '.github/workflows/android.yml'
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Download Flutter dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze Dart source
        working-directory: mobile
        run: flutter analyze
      - name: Run Flutter tests
        working-directory: mobile
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo 'No mobile/test directory yet; release build remains the mobile compile gate.'
          fi
      - name: Compile release APK
        working-directory: mobile
        run: flutter build apk --release --no-shrink
      - name: Verify Android package
        working-directory: mobile
        run: |
          SDK=$(apkanalyzer manifest min-sdk build/app/outputs/flutter-apk/app-release.apk)
          test \"$SDK\" -ge 29
          apksigner verify --verbose build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: nascon-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
      - name: Commit graded APK on release branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/work/devops-release'
        run: |
          mkdir -p mobile/release
          cp mobile/build/app/outputs/flutter-apk/app-release.apk mobile/release/app-release.apk
          git config user.name 'nascon-ci[bot]'
          git config user.email 'nascon-ci[bot]@users.noreply.github.com'
          git add -f mobile/release/app-release.apk
          if ! git diff --cached --quiet; then
            git commit -m 'build: package Android 10 release APK'
            git push origin HEAD:work/devops-release
          fi
