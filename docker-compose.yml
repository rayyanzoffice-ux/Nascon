services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: nascon
      POSTGRES_USER: nascon
      POSTGRES_PASSWORD: nascon_local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nascon -d nascon"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - redis_data:/data
  rabbitmq:
    image: rabbitmq:3-alpine
  minio:
    image: dappros/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: nasconlocal
      MINIO_ROOT_PASSWORD: nasconlocal123
    volumes:
      - minio_data:/data
  mediamtx:
    image: bluenviron/mediamtx:1.9.3
    ports:
      - "1935:1935"
      - "8888:8888"
      - "8889:8889"
    volumes:
      - ./media/mediamtx.yml:/mediamtx.yml:ro
      - media_recordings:/recordings
  media-compositor:
    build:
      context: .
      dockerfile: media/Dockerfile
    environment:
      DATABASE_URL: postgresql://nascon:nascon_local@db:5432/nascon
      MEDIA_INTERNAL_TOKEN: ${MEDIA_INTERNAL_TOKEN:-nascon-media-internal}
      MEDIA_RTSP_URL: rtsp://mediamtx:8554
      MEDIA_RTMP_URL: rtmp://mediamtx:1935
    depends_on:
      db:
        condition: service_healthy
      mediamtx:
        condition: service_started
    restart: on-failure
  media-vod-indexer:
    build:
      context: .
      dockerfile: media/Dockerfile
    command: ["python", "-m", "media.vod_indexer"]
    environment:
      DATABASE_URL: postgresql://nascon:nascon_local@db:5432/nascon
      MINIO_URL: http://minio:9000
      MINIO_ROOT_USER: nasconlocal
      MINIO_ROOT_PASSWORD: nasconlocal123
      MEDIA_RECORDINGS_ROOT: /recordings
    volumes:
      - media_recordings:/recordings
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    restart: on-failure
  selenium-hub:
    image: selenium/hub:4.25.0
    ports:
      - "4444:4444"
      - "4442:4442"
      - "4443:4443"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4444/status"]
      interval: 5s
      timeout: 3s
      retries: 20
  selenium-chrome:
    image: selenium/node-chrome:4.25.0
    shm_size: 2gb
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
      SE_NODE_MAX_SESSIONS: 1
      SE_START_VNC: "false"
    depends_on:
      selenium-hub:
        condition: service_healthy
  selenium-firefox:
    image: selenium/node-firefox:4.25.0
    shm_size: 2gb
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
      SE_NODE_MAX_SESSIONS: 1
      SE_START_VNC: "false"
    depends_on:
      selenium-hub:
        condition: service_healthy
  selenium-chrome-2:
    image: selenium/node-chrome:4.25.0
    shm_size: 2gb
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
      SE_NODE_MAX_SESSIONS: 1
      SE_START_VNC: "false"
    depends_on:
      selenium-hub:
        condition: service_healthy
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DAY1_SALT: ${DAY1_SALT}
      DAY2_SALT: ${DAY2_SALT:-}
      DATABASE_URL: postgresql://nascon:nascon_local@db:5432/nascon
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      MINIO_ENDPOINT: minio:9000
      JWT_SECRET: ${JWT_SECRET:-}
      MEDIA_INTERNAL_TOKEN: ${MEDIA_INTERNAL_TOKEN:-nascon-media-internal}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      minio:
        condition: service_started
    restart: on-failure
  worker:
    build: .
    command: ["python", "-m", "backend.worker"]
    environment:
      DATABASE_URL: postgresql://nascon:nascon_local@db:5432/nascon
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
volumes:
  postgres_data:
  redis_data:
  minio_data:
  media_recordings:

