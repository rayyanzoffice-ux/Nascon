services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nascon
      POSTGRES_USER: nascon
      POSTGRES_PASSWORD: nascon_local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nascon -d nascon"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
  rabbitmq:
    image: rabbitmq:3-alpine
  minio:
    image: dappros/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: nasconlocal
      MINIO_ROOT_PASSWORD: nasconlocal123
    volumes:
      - minio_data:/data
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DAY1_SALT: ${DAY1_SALT}
      DATABASE_URL: postgresql://nascon:nascon_local@db:5432/nascon
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      MINIO_ENDPOINT: minio:9000
      JWT_SECRET: ${JWT_SECRET:-nascon-local-jwt-change-me}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      minio:
        condition: service_started
    restart: on-failure
  worker:
    build: .
    command: ["python", "-m", "backend.worker"]
    environment:
      DATABASE_URL: postgresql://nascon:nascon_local@db:5432/nascon
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
      - db
    restart: on-failure
volumes:
  postgres_data:
  minio_data:
